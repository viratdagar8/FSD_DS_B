<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map</title>
  </head>
  <body>
    <script>
      const num = [19, 23, 43, 34, 55, 67, 32, 44, 60];
      const even = num.filter((i) => i % 2 == 0);

      const sqr = even.map((i) => i * i);
      console.log("Square =", sqr);
      document.write("square of even numbers=", sqr);
    </script>
  </body>
</html>
