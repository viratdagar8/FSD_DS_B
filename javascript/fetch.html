<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My_Shop</title>
    <style>
      table {
        width: 80%;
        margin: auto;
        padding: 10px;
        font-size: 25px;
        width: 100%;
        color: chocolate;
        border: 2px solid black;
      }
      #data {
        text-align: center;
        color: black;
      }
    </style>
  </head>
  <body>
    <table>
      <thead id="head">
        <tr>
          <th>S.No</th>
          <th>Title</th>
          <th>Image</th>
          <th>Category</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="data"></tbody>
    </table>

    <script>
      element = document.getElementById("data");
      const url = "https://dummyjson.com/product";
      async function loaddata() {
        try {
          const res = await fetch(url);
          const data = await res.json();
          console.log("DATA:", data.products);
          let row = "";
          data.products.map((i, index) => {
            row += `
            <tr>
              <td>${index + 1}</td>
              <td>${i.title}</td>
              <td><img src="${i.images[0]}" width="100" height="100"></td>
              <td>${i.category}</td>
              <td>${i.price}</td>
            </tr>
            `;
            element.innerHTML = row;
          });
        } catch (e) {
          console.log("Error:", e);
        }
      }
      loaddata();
    </script>
  </body>
</html>
