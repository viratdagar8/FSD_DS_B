<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter</title>
  </head>
  <body>
    <script>
      const num = [11, 22, 32, 45, 54, 33];
      const even = num.filter((i) => i % 2 == 0);
      console.log("num=", num);
      console.log("Even=", even);
      const odd = num.filter((i) => i % 2 != 0);
      console.log("Odd=", odd);
    </script>
  </body>
</html>
