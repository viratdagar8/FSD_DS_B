<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        function add(n,m){
            let sum=n+m;    
            document.write("sum: "+sum);//without return value
            return sum;
          }
            let addition=add(5,100);    
            document.write("<br>"+"addition: "+addition);//with return value

            //arrow function
            const abes=() => "Hello World";
            abes();
            document.write("<br>"+abes());
            

    </script>
</body>
</html>
